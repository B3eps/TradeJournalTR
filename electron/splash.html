<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Trade Günlüğü</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0a0a0a; color: #f2f3f5; font: 14px/1.5 "Segoe UI", sans-serif; }
    main { display: flex; align-items: center; gap: 14px; }
    .spinner { width: 22px; height: 22px; border: 2px solid #34363b; border-top-color: #8b7cff; border-radius: 50%; animation: spin .8s linear infinite; }
    p { margin: 0; color: #b3b5bd; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
  </style>
</head>
<body><main><span class="spinner" aria-hidden="true"></span><p>Trade Günlüğü hazırlanıyor…</p></main></body>
</html>
