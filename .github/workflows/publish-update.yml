name: Release Trade Gunlugu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set a unique release version
        shell: pwsh
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          npm version $version --no-git-tag-version

      - name: Prepare bundled ActivityWatch
        shell: pwsh
        run: ./scripts/prepare-activitywatch.ps1

      - name: Build application
        run: npm run build

      - name: Bundle local server
        run: npm run bundle

      - name: Publish Windows release and updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win nsis --publish always
