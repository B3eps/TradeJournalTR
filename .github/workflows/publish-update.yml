name: Release Trade Gunlugu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    concurrency:
      group: release-${{ github.workflow }}-${{ github.run_number }}
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set a unique release version
        shell: pwsh
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          npm version $version --no-git-tag-version

      - name: Prepare bundled ActivityWatch
        shell: pwsh
        run: ./scripts/prepare-activitywatch.ps1

      - name: Build application
        run: npm run build

      - name: Bundle local server
        run: npm run bundle

      - name: Package Windows installer and updater metadata
        run: npx electron-builder --win nsis --publish never

      - name: Create or verify the release tag
        shell: pwsh
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          $tag = "v$version"
          git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = (git rev-parse "${tag}^{commit}").Trim()
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
              throw "Release tag $tag resolves to $tagCommit, expected commit $env:GITHUB_SHA"
            }
            Write-Host "Reusing $tag at peeled commit $tagCommit"
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $tag $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Could not create release tag $tag" }
            git push origin "refs/tags/${tag}"
            if ($LASTEXITCODE -ne 0) { throw "Could not push release tag $tag" }
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Publish a complete release asset set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(
            "dist-app/Trade-Gunlugu-Setup.exe",
            "dist-app/Trade-Gunlugu-Setup.exe.blockmap",
            "dist-app/latest.yml"
          )
          $expectedNames = @(
            "Trade-Gunlugu-Setup.exe",
            "Trade-Gunlugu-Setup.exe.blockmap",
            "latest.yml"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          }

          $releaseInfoJson = gh release view $env:RELEASE_TAG --json databaseId,isDraft 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if (-not $releaseExists) {
            gh release create $env:RELEASE_TAG --draft --title $env:RELEASE_TAG --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release $env:RELEASE_TAG" }
            $releaseInfoJson = gh release view $env:RELEASE_TAG --json databaseId,isDraft
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect draft release $env:RELEASE_TAG" }
          }

          $releaseInfo = $releaseInfoJson | ConvertFrom-Json
          $releaseJson = gh api "repos/B3eps/TradeJournalTR/releases/$($releaseInfo.databaseId)"
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect release assets for $env:RELEASE_TAG" }
          $release = $releaseJson | ConvertFrom-Json
          $expectedAssets = @{}
          foreach ($assetPath in $assets) {
            $file = Get-Item -LiteralPath $assetPath
            $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $expectedAssets[$file.Name] = @{ Size = [long]$file.Length; Digest = "sha256:$hash" }
          }
          function Assert-ReleaseAssets($releaseAssets, $label) {
            foreach ($name in $expectedNames) {
              $assetMatches = @($releaseAssets | Where-Object { $_.name -eq $name })
              if ($assetMatches.Count -ne 1) { throw "$label must contain exactly one $name asset" }
              $actual = $assetMatches[0]
              $expected = $expectedAssets[$name]
              if ($actual.state -ne "uploaded" -or [long]$actual.size -ne $expected.Size -or $actual.digest -ne $expected.Digest) {
                throw "$label asset $name does not match this run's build (expected $($expected.Digest), $($expected.Size) bytes; got $($actual.digest), $($actual.size) bytes, state $($actual.state))"
              }
            }
          }
          if (-not $release.draft) {
            Assert-ReleaseAssets $release.assets "Published release $env:RELEASE_TAG"
            Write-Host "Published release $env:RELEASE_TAG has the expected build assets; leaving it unchanged"
            exit 0
          }

          # A draft is not visible to users. Replacing every expected name here makes
          # retries after partial uploads converge on the current run's complete set.
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Asset upload failed; draft $env:RELEASE_TAG remains unpublished and can be retried" }

          $releaseJson = gh api "repos/B3eps/TradeJournalTR/releases/$($releaseInfo.databaseId)"
          if ($LASTEXITCODE -ne 0) { throw "Could not verify draft release $env:RELEASE_TAG" }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.draft) {
            throw "Release $env:RELEASE_TAG was published before verification completed"
          }
          Assert-ReleaseAssets $release.assets "Draft release $env:RELEASE_TAG"

          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Could not publish complete release $env:RELEASE_TAG" }
